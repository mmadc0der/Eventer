[package]
name = "eventer"
version = "0.1.0"
edition = "2021"
description = "Append-only columnar JSON event store"
publish = false

[lib]
name = "eventer"
crate-type = ["cdylib", "rlib", "staticlib"]

[dependencies]
crc32fast = "1"
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "float_roundtrip", "preserve_order", "raw_value"] }
zstd = "0.13"
