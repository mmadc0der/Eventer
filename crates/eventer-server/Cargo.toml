[package]
name = "eventer-server"
version = "0.1.0"
edition = "2021"
description = "HTTP server for the Eventer store"
publish = false

[dependencies]
axum = "0.7"
clap = { version = "4", features = ["derive"] }
eventer = { path = "../eventer" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.4", features = ["util"] }
