name: Close unsuccessful experiments

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/close-unsuccessful.yml

permissions:
  issues: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: Replace the prefix issue whose stock count was wrong
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh issue close 126 --repo mmadc0der/Eventer --reason "not planned" --comment "Cancelled before implementation. The published check said prefix=action=c with ok=true is 12500. Every stock click row is an even index, and ok is true on even rows, so that count is 25000. A replacement issue carries the corrected check. Do not implement this copy."
          gh issue create --repo mmadc0der/Eventer --title "Filter string and text columns by prefix" --body-file - << 'BODY'
`eq` and `in` match a whole string. An event name is usually a family (`page_view`, `page_leave`, `checkout_start`), and a dashboard asks for the family. ClickHouse answers that with `startsWith` on a low-cardinality dictionary. QuestDB answers the same shape with `LIKE` on the first bytes of a symbol. Eventor already stores `action` and `note` as a dictionary, and the zone already keeps an exact set or a bloom, but neither the HTTP routes nor `Predicate` can ask for a prefix.

Add `Predicate::Prefix` and repeat `prefix=field=value` on `GET /events`, `GET /events/count`, `GET /events/histogram`, `GET /events/stats`, `GET /events/latest`, `GET /events/distinct`, `GET /events/quantile`, and `GET /events/topk`. The match is a byte prefix of a string or text value. Several `prefix` parameters on different fields are AND-ed with `eq`, `in`, and the numeric ranges. A prefix on an int, timestamp, float, bool, decimal, or json column is status `400` and does not read the store. An empty value, an empty field name, or an unknown field is the same `400`. `prefix` on `POST /events/drop` is status `400`.

The literal is the raw text, including the word `null`, the same way `eq` treats string and text. A null column does not match a prefix. A block the zone map can reject is not read. The encoder, the C API, and the on-disk files stay as they are. This is not a size experiment. A stock bench stays data `3639` and index `578`.

On the stock events, `prefix=action=c` is `25000` (`click` only). `prefix=action=s` is `25000` (`scroll` only). `prefix=action=zzz` is `0`. `prefix=note=land` is `25000`. `prefix=action=c` together with `ok=true` is `25000`, because every stock `click` row has an even index and `ok` is true on even rows.

This fails if any of those counts is wrong, if a bad `prefix` reads the store, if `prefix` is accepted on `POST /events/drop` or on a non-text column, or if the stock data file is not `3639` or the index total is not `578`.
BODY
